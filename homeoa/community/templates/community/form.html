{% extends "ui/base.html" %}
{% load i18n %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="hero"><div><h1>{{ title }}</h1></div></div>
<section class="card">
  <form method="post" class="form-grid">
    {% csrf_token %}
    {% include "ui/components/form.html" %}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{% translate "Save" %}</button>
      <a class="btn btn-ghost" href="{{ cancel }}">{% translate "Cancel" %}</a>
    </div>
  </form>
  {% if delete_url %}
  <form method="post" action="{{ delete_url }}" class="card-b">
    {% csrf_token %}
    <button type="submit" class="btn btn-ghost">{% translate "Delete" %}</button>
  </form>
  {% endif %}
</section>
{% endblock %}
