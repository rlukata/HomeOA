{% load i18n homeoa_ui %}{% if count is not None %}<a class="icon-btn notif-bell" href="{% url 'notify:inbox' %}" data-testid="notif-bell" aria-label="{% if count %}{% blocktranslate count n=count %}Notifications, {{ n }} unread{% plural %}Notifications, {{ n }} unread{% endblocktranslate %}{% else %}{% translate 'Notifications' %}{% endif %}">{% icon "bell" %}{% if count %}<span class="notif-count" data-testid="notif-count" aria-hidden="true">{{ count }}</span>{% endif %}</a>{% endif %}
