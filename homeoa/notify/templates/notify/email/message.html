{% load i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;padding:24px 16px;background:#f5f6f3;color:#1b211e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e7eae5;border-radius:12px;padding:24px">
    <p style="margin:0 0 16px;color:#1d6b57;font-weight:600">{{ association.name }}</p>
    <h1 style="margin:0 0 12px;font-size:18px">{{ subject }}</h1>
    <div>{{ body|linebreaks }}</div>
    <p style="margin:24px 0 0;color:#5f6862;font-size:13px">{% blocktranslate with name=association.name %}Sent by {{ name }} through HomeOA.{% endblocktranslate %}</p>
  </div>
</body>
</html>
