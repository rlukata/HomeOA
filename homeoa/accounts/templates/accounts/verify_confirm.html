{% extends "accounts/base_auth.html" %}
{% load i18n %}
{% block content %}
<h1>{% translate "Sign in" %}</h1>
<p>{% blocktranslate %}Sign in as {{ masked_email }}?{% endblocktranslate %}</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-primary btn-lg">{% translate "Sign in" %}</button>
</form>
{% endblock %}
