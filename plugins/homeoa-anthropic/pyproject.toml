[project]
name = "homeoa-anthropic"
version = "0.1.0"
description = "HomeOA AI assistance through Anthropic's Claude"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = ["anthropic==1.11.0"]

[project.entry-points."homeoa.plugins"]
anthropic = "homeoa_anthropic.manifest:manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homeoa_anthropic"]
