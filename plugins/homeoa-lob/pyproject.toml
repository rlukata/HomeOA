[project]
name = "homeoa-lob"
version = "0.1.0"
description = "HomeOA postal mail through Lob (in-repo fake only; no live key paths yet)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = []

[project.entry-points."homeoa.plugins"]
lob = "homeoa_lob.manifest:manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homeoa_lob"]
