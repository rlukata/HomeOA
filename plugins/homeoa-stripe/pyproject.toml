[project]
name = "homeoa-stripe"
version = "0.1.0"
description = "HomeOA ACH payments through Stripe (in-repo fake only; no live key paths yet)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = []

[project.entry-points."homeoa.plugins"]
stripe = "homeoa_stripe.manifest:manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homeoa_stripe"]
